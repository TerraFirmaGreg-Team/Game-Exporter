evaluationDependsOn(':core')

configurations {
    embed
    implementation.extendsFrom(embed)
}

configurations.matching { it.name == 'additionalRuntimeClasspath' }.configureEach {
    extendsFrom configurations.embed
    project.dependencies.add(name, project(':core'))
    exclude group: 'it.unimi.dsi', module: 'fastutil-core'
}

dependencies {
    implementation project(':core')
    embed libs.jackson.databind
    embed libs.jackson.blackbird
    embed libs.fastutil
    embed libs.webp4j
    embed libs.jsonschema.generator
    embed libs.jsonschema.module.jackson
    embed libs.konf.core
    embed libs.konf.json
    embed libs.jspecify
}

pluginManager.withPlugin('xyz.wagyourtail.jvmdowngrader') {
    project.jvmdg.downgradeTo = JavaVersion.VERSION_21

    project.tasks.named('downgradeJar') { t ->
        t.destinationDirectory = project.layout.buildDirectory.dir('jvmdg')
    }
    project.tasks.named('shadeDowngradedApi') { t ->
        t.destinationDirectory = project.layout.buildDirectory.dir('jvmdg')
        t.shadePath = 'team/terrafirmagreg/exporter/jvmdg'
    }

    project.tasks.register('downgradeEmbed',
            project.jvmdg.getClass().classLoader.loadClass(
                    'xyz.wagyourtail.jvmdg.gradle.task.files.DowngradeFiles')) { t ->
        t.inputCollection = project.configurations.embed
    }
}

tasks.named('jar').configure {
    enabled = false
}

shadowJar {
    from project(':core').sourceSets.main.output
    exclude 'META-INF/versions/**'
    addMultiReleaseAttribute = false
    configurations.set([project.configurations.embed])
    enableAutoRelocation = false
    relocate 'com.electronwill', "${mod_package}.${mod_id}.shadow.com.electronwill"
    relocate 'com.fasterxml', "${mod_package}.${mod_id}.shadow.com.fasterxml"
    relocate 'com.github.victools', "${mod_package}.${mod_id}.shadow.com.github.victools"
    relocate 'it.unimi', "${mod_package}.${mod_id}.shadow.it.unimi"
    relocate 'org.jspecify', "${mod_package}.${mod_id}.shadow.org.jspecify"
    relocate 'org.slf4j', "${mod_package}.${mod_id}.shadow.org.slf4j"
    relocate 'tools.jackson', "${mod_package}.${mod_id}.shadow.tools.jackson"
    relocationPrefix = "${mod_package}.${mod_id}.shadow"
    mergeServiceFiles()
    destinationDirectory = layout.buildDirectory.dir('tmp')
    archiveClassifier = ''
}

configurations.configureEach {
    resolutionStrategy.force 'com.electronwill.night-config:json:3.6.7'
}

configurations.embed {
    resolutionStrategy.force 'tools.jackson.core:jackson-databind:3.2.3',
        'tools.jackson.core:jackson-core:3.2.3',
        'tools.jackson.module:jackson-module-blackbird:3.2.3',
        'com.fasterxml.jackson.core:jackson-annotations:2.22'
}
