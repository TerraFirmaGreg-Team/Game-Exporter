name: "Build"
run-name: "[📦]: Build #${{ github.run_number }}"
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'modules/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  info:
    name: "[🖥️] Project Info"
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      version_type: ${{ steps.info.outputs.version_type }}
      full_name: ${{ steps.info.outputs.full_name }}
      java_versions: ${{ steps.info.outputs.java_versions }}
      platforms: ${{ steps.info.outputs.platforms }}
      make_release: ${{ steps.info.outputs.make_release }}
    steps:
      - name: Collect info
        id: info
        uses: TerraFirmaGreg-Team/Actions/mod/info@main
        with:
          required_files: "gradle.properties, build.gradle, README.md, modules"
          platforms_dir: modules

  build:
    name: "[📦] Project Build"
    needs: [info]
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: TerraFirmaGreg-Team/Actions/mod/build@main
        with:
          version: ${{ needs.info.outputs.version }}
          replace_version: true
          java_version: ${{ needs.info.outputs.java_versions }}
          gradle_args: build --no-daemon
          artifact_name: ${{ needs.info.outputs.full_name }}
          artifact_path: build/libs/*.jar

  release:
    name: "[🚀] Release ${{ matrix.platform.id }}"
    needs: [info, build]
    runs-on: ubuntu-latest
    if: ${{ needs.info.outputs.make_release == 'true' }}
    strategy:
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(needs.info.outputs.platforms) }}
    steps:
      - name: Publish
        uses: TerraFirmaGreg-Team/Actions/mod/release@main
        with:
          full_name: ${{ matrix.platform.base }}-${{ needs.info.outputs.version }}
          version: ${{ needs.info.outputs.version }}
          version_type: ${{ needs.info.outputs.version_type }}
          files: ${{ matrix.platform.base }}-*.jar
          loaders: ${{ matrix.platform.loader }}
          game_versions: ${{ matrix.platform.game_versions }}
          java: ${{ matrix.platform.java }}
          environment: "client | server"
          github_name: ${{ needs.info.outputs.version }}
          github_prerelease: ${{ needs.info.outputs.version_type != 'release' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
#          modrinth_id: ${{ vars.MODRINTH_ID }}
#          modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
#          curseforge_id: ${{ vars.CURSEFORGE_ID }}
#          curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
