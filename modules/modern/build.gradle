plugins {
    id 'java'
    alias(libs.plugins.legacyforge)
    alias(libs.plugins.shadow)
    alias(libs.plugins.jvmdowngrader)
}

dependencies {
    modApi "dev.emi:emi-forge:${libs.versions.emi.get()}@jar"
    modApi libs.patchouli
    modApi "maven.modrinth:reliable-emi:9b1U5yMI"
    compileOnly libs.mixin
    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.get()}:processor"
}

def exporterRefmap = null

legacyForge {
    version = "${minecraft_version}-${loader_version}"

    mixin {
        config 'exporter.mixins.json'
        exporterRefmap = add sourceSets.main, 'exporter.mixins.refmap.json'
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'INFO'
        }

        client {
            client()
            ideName = "Modern Client"
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            ideName = "Modern Server"
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

shadowJar {
    manifest {
        attributes 'FMLAT': 'accesstransformer.cfg'
        attributes 'MixinConfigs': 'exporter.mixins.json'
    }
    from(exporterRefmap)
}

tasks.named('reobfJar') {
    enabled = false
}

obfuscation {
    reobfuscate(tasks.named('shadowJar'), sourceSets.main)
}

tasks.named('reobfShadowJar') {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    input.set(tasks.named('shadeDowngradedApi').flatMap { it.archiveFile })
    dependsOn 'downgradeEmbed'
    libraries.setFrom(
            sourceSets.main.compileClasspath.minus(configurations.embed),
            tasks.named('downgradeEmbed').map { it.outputMap.values() })
}
